# buildspec/test.yml — CodeBuild "test" stage for the Terraform pipeline
#
# Runs on the PR/merge "Test" action of the CodePipeline. Changes NOTHING in AWS:
# it validates, security-scans, and produces a Terraform plan that the later
# "Apply" action consumes.
#
# Pipeline flow this supports:
#   Source (GitHub, via CodeStar connection)
#     -> Test   (this file)                  terraform fmt/validate/test + security + plan
#     -> Approve (CodePipeline manual gate, prod only)
#     -> Apply  (buildspec/apply.yml)        terraform apply of the saved plan
#
# REQUIRED environment variables (set on the CodeBuild project or the pipeline action):
#   TF_ENV           dev | stage | prod        -> selects infra/envs/<TF_ENV>
#   TF_STATE_BUCKET  shopflow-global-resources-tfstate
#   TF_STATE_REGION  ca-central-1
#   AWS_DEFAULT_REGION ca-central-1
# OPTIONAL:
#   TF_VERSION       Terraform version to install. MUST match the version that wrote
#                    your state (run `terraform version` locally). Default below.
#   SEC_SOFT_FAIL    "true" to report security findings without failing the build
#                    (default "false" = a HIGH/CRITICAL finding fails the stage).
#
# NOTE on variables: this repo's .gitignore excludes *.tfvars, so terraform.tfvars is
# NOT in the CodeBuild source. Pass input variables as TF_VAR_* environment variables
# on the CodeBuild project (or load them from SSM Parameter Store), or commit a
# sanitized infra/envs/<env>/<env>.tfvars.example and `-var-file` it. See buildspec/README.md.

version: 0.2

env:
  variables:
    TF_VERSION: "1.17.2"            # change to match your local `terraform version`
    SEC_SOFT_FAIL: "false"
  # Example: pull non-secret tf vars from SSM instead of committing tfvars.
  # parameter-store:
  #   TF_VAR_vpc_cidr: /shopflow/dev/vpc_cidr

phases:
  install:
    commands:
      - set -euo pipefail
      - echo "Installing Terraform ${TF_VERSION}, checkov, trivy..."
      - curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/tf.zip -d /usr/local/bin
      - terraform version
      - pip install --quiet checkov
      - curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - trivy --version

  pre_build:
    commands:
      - set -euo pipefail
      - test -n "${TF_ENV}" || { echo "TF_ENV is required (dev|stage|prod)"; exit 1; }
      - export TF_DIR="infra/envs/${TF_ENV}"
      - test -d "${TF_DIR}" || { echo "No such env dir: ${TF_DIR}"; exit 1; }
      - echo "Initializing ${TF_DIR} against s3://${TF_STATE_BUCKET}/env/${TF_ENV}/terraform.tfstate"
      - cd "${TF_DIR}"
      # Partial backend config (keeps backend.tf free of account-specific values).
      # use_lockfile=true uses S3-native state locking (Terraform >= 1.10), so no
      # DynamoDB lock table is required.
      - |
        terraform init -input=false \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="key=env/${TF_ENV}/terraform.tfstate" \
          -backend-config="region=${TF_STATE_REGION}" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"

  build:
    commands:
      - set -euo pipefail
      - cd "infra/envs/${TF_ENV}"
      - echo "== terraform fmt ==" && terraform fmt -check -recursive
      - echo "== terraform validate ==" && terraform validate -no-color
      - echo "== security: checkov ==" && checkov -d . --quiet --compact $( [ "${SEC_SOFT_FAIL}" = "true" ] && echo "--soft-fail" )
      - echo "== security: trivy config ==" && trivy config . --severity HIGH,CRITICAL $( [ "${SEC_SOFT_FAIL}" = "true" ] && echo "--exit-code 0" || echo "--exit-code 1" )
      # terraform test runs *.tftest.hcl if any exist; skip cleanly when there are none.
      - echo "== terraform test ==" && ( ls ./tests/*.tftest.hcl *.tftest.hcl >/dev/null 2>&1 && terraform test || echo "no .tftest.hcl files, skipping" )
      - echo "== terraform plan ==" && terraform plan -input=false -lock=true -out=tfplan $( [ -f "${TF_ENV}.tfvars" ] && echo "-var-file=${TF_ENV}.tfvars" )
      - terraform show -no-color tfplan > plan.txt
      - echo "Plan written. Review in the Apply stage / approval gate."

artifacts:
  # Carry the working dir, provider plugins, lockfile, and the saved plan to the
  # Apply stage so it applies EXACTLY what was planned and reviewed.
  files:
    - "infra/envs/${TF_ENV}/**/*"
  name: tf-plan-$TF_ENV
