version: 0.2

env:
  variables:
    # Default only. A value set on the CodeBuild project overrides this.
    TF_VERSION: "1.10.5"

phases:
  install:
    commands:
      - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /usr/local/bin
      - terraform version
      - |
        if [ "$MODE" = "validate" ]; then
          pip install --quiet checkov
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
        fi

  build:
    commands:
      # Each pipeline action sets ENV (dev|stage|prod) and MODE (validate|plan|apply)
      - cd "infra/envs/${ENV}"
      - |
        set -eu    # stop at the first error; treat unset variables as errors

        # ---------- VALIDATE: check the code, change nothing ----------
        if [ "${MODE:-}" = "validate" ]; then
          terraform init -backend=false -input=false   # offline init, no state or credentials needed
          terraform fmt -check -recursive ../..
          terraform validate

          # Security scanners: either report only (soft fail) or fail the build
          if [ "${SEC_SOFT_FAIL:-false}" = "true" ]; then
            SOFT="--soft-fail"
            TRIVY_EXIT=0
          else
            SOFT=""
            TRIVY_EXIT=1
          fi
          echo "== checkov =="
          checkov -d . --quiet --compact $SOFT
          echo "== trivy =="
          trivy config . --severity HIGH,CRITICAL --exit-code $TRIVY_EXIT

          # Run terraform tests only if test files exist
          if ls *.tftest.hcl tests/*.tftest.hcl >/dev/null 2>&1; then
            echo "== terraform test =="
            terraform test
          else
            echo "no .tftest.hcl files, skipping terraform test"
          fi

        # ---------- PLAN: work out what would change, save it as tfplan ----------
        elif [ "${MODE:-}" = "plan" ]; then
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

          # Destroy guard: count the resources the plan would delete
          DESTROYS=$(jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length' plan.json)
          echo "resources to destroy: $DESTROYS"

          if [ "$DESTROYS" -gt 0 ]; then
            echo "Resources that would be DESTROYED:"
            jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "  - " + .address' plan.json

            # Allowed only if the commit message contains [allow-destroy]
            MSG=$(git -C "$CODEBUILD_SRC_DIR" log -1 --pretty=%B 2>/dev/null || echo "")
            if echo "$MSG" | grep -q '\[allow-destroy\]'; then
              echo "✅ [allow-destroy] found in commit message — destroy permitted."
            else
              echo "❌ Plan would destroy $DESTROYS resource(s). Add [allow-destroy] to the commit message to proceed."
              exit 1
            fi
          fi

        # ---------- APPLY: run the saved plan ----------
        elif [ "${MODE:-}" = "apply" ]; then
          terraform init -input=false
          terraform apply -input=false tfplan

        # ---------- anything else is a mistake ----------
        else
          echo "unknown MODE=${MODE:-} (expected validate|plan|apply)"
          exit 1
        fi

# The Plan action passes this to the Apply action, so tfplan must be included.
artifacts:
  base-directory: .
  files:
    - "**/*"