version: 0.2

# One buildspec, reused by every pipeline action. Two inputs come from the action:
#   ENV  = dev | stage | prod        (which infra/envs/<ENV> dir to run)
#   MODE = validate | plan | apply
#
#   validate : fmt + validate (changes nothing)
#   plan     : terraform plan -out=tfplan  (+ human-readable plan.txt); the pipeline
#              exports the whole tree as this action's OUTPUT artifact
#   apply    : terraform apply of the SAVED tfplan from the plan action's artifact
#
# Terraform isn't in the standard CodeBuild image, so we install it here.

env:
  variables:
    TF_VERSION: "1.10.5"

phases:
  install:
    commands:
      - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /usr/local/bin
      - terraform version
  build:
    commands:
      - cd "infra/envs/${ENV}"
      - terraform init -input=false
      - |
        case "$MODE" in
          validate)
            terraform fmt -check -recursive ../..
            terraform validate
            ;;
          plan)
            terraform plan -input=false -out=tfplan
            terraform show -no-color tfplan > plan.txt
            ;;
          apply)
            terraform apply -input=false tfplan
            ;;
          *)
            echo "unknown MODE=$MODE (expected validate|plan|apply)" && exit 1
            ;;
        esac

# Carry the WHOLE tree to the next action: the apply action needs the env dir,
# the saved tfplan, AND the modules it references (../../modules/...). Apply
# re-inits (fast, honours the lock file) then applies the saved plan.
artifacts:
  files:
    - '**/*'
