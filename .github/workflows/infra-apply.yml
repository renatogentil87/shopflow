# .github/workflows/infra-apply.yml
# Runs on merge to main. Applies each stack, gated per-stage by a GitHub Environment.
# Order differs from plan: apply is SEQUENTIAL (needs:) so dev must succeed before stage,
# stage before prod — that's the promotion. global (governance) applies first.
name: infra-apply

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"   # bootstrap is applied by hand, never by the pipeline

permissions:
  id-token: write
  contents: read

jobs:
  global:
    runs-on: ubuntu-latest
    environment: global
    defaults:
      run:
        working-directory: infra/global
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CENTRAL_ACCOUNT_ID }}:role/shopflow-pipeline
          aws-region: ca-central-1
      - run: terraform init
      - run: terraform apply -auto-approve

  dev:
    needs: global
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CENTRAL_ACCOUNT_ID }}:role/shopflow-pipeline
          aws-region: ca-central-1
      - run: terraform init
      - run: terraform apply -auto-approve

  stage:
    needs: dev
    runs-on: ubuntu-latest
    environment: stage
    defaults:
      run:
        working-directory: infra/envs/stage
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CENTRAL_ACCOUNT_ID }}:role/shopflow-pipeline
          aws-region: ca-central-1
      - run: terraform init
      - run: terraform apply -auto-approve

  prod:
    needs: stage               # promotion: only after stage succeeds
    runs-on: ubuntu-latest
    environment: prod          # gated — add required reviewers on this Environment
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CENTRAL_ACCOUNT_ID }}:role/shopflow-pipeline
          aws-region: ca-central-1
      - run: terraform init
      - run: terraform apply -auto-approve
