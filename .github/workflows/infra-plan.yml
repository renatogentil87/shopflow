# .github/workflows/infra-plan.yml
# Runs on every PR touching infra/. Validates + plans, changes nothing.
name: infra-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"   # bootstrap is applied by hand, never by the pipeline

permissions:
  id-token: write       # REQUIRED: lets the job mint a GitHub OIDC token to assume the AWS role
  contents: read
  pull-requests: write  # optional: to post the plan back onto the PR

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/global   # the governance stack; change per stack
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CENTRAL_ACCOUNT_ID }}:role/shopflow-pipeline
          aws-region: ca-central-1
      - run: terraform init
      - run: terraform fmt -check -recursive
      - run: terraform validate
      # - name: tflint / checkov   # install + run here; a non-zero exit fails the PR
      - run: terraform plan -no-color
